<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeonardoTrader — Visor de Charts</title>
  <meta name="description" content="Visor gratuito de charts de acciones con análisis IA. Powered by Yahoo Finance + Claude AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base: #0b0e13;
      --bg-panel: #13181f;
      --bg-hover: #1a2030;
      --bg-active: #1c2840;
      --border: #1e2535;
      --border-mid: #2a3347;
      --text-primary: #e8edf5;
      --text-secondary: #8892a4;
      --text-muted: #4a5568;
      --accent: #3b82f6;
      --accent-dim: #1e3a5f;
      --green: #22c55e;
      --green-dim: #0d2b1a;
      --red: #ef4444;
      --red-dim: #2b0d0d;
      --amber: #f59e0b;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-columns: 180px 1fr;
      grid-template-rows: 48px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    #logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    #logo .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #logo span { color: var(--accent); }

    .sep { width: 1px; height: 20px; background: var(--border-mid); flex-shrink: 0; }

    #ticker-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #ticker-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    #ticker-price {
      font-size: 15px;
      font-weight: 600;
    }

    #ticker-change {
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    #ticker-change.pos { background: var(--green-dim); color: var(--green); }
    #ticker-change.neg { background: var(--red-dim); color: var(--red); }

    #tf-group {
      display: flex;
      gap: 3px;
      margin-left: auto;
    }

    .tf-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-secondary);
      border-radius: 5px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      transition: all 0.15s;
    }

    .tf-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tf-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    #ind-group { display: flex; gap: 3px; }

    .ind-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border-mid);
      color: var(--text-muted);
      border-radius: 5px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      transition: all 0.15s;
    }

    .ind-btn.on { background: #0d2b1a; border-color: var(--green); color: var(--green); }

    #ai-topbtn {
      padding: 6px 14px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }

    #ai-topbtn:hover { background: var(--accent); color: #fff; }

    /* ── Sidebar ── */
    #sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #wl-header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
    }

    #wl-header h3 {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #search-box {
      margin: 8px 8px 4px;
      padding: 5px 8px;
      background: var(--bg-base);
      border: 1px solid var(--border-mid);
      border-radius: 5px;
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      width: calc(100% - 16px);
      outline: none;
    }

    #search-box:focus { border-color: var(--accent); }
    #search-box::placeholder { color: var(--text-muted); }

    #watchlist { flex: 1; overflow-y: auto; }
    #watchlist::-webkit-scrollbar { width: 3px; }
    #watchlist::-webkit-scrollbar-track { background: transparent; }
    #watchlist::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

    .wl-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .wl-item:hover { background: var(--bg-hover); }

    .wl-item.active {
      background: var(--bg-active);
      border-left: 2px solid var(--accent);
    }

    .wl-row { display: flex; justify-content: space-between; align-items: center; }
    .wl-symbol { font-size: 12px; font-weight: 600; color: var(--text-primary); }
    .wl-name { font-size: 10px; color: var(--text-muted); }
    .wl-price { font-size: 11px; color: var(--text-secondary); }
    .wl-chg { font-size: 10px; }
    .wl-chg.pos { color: var(--green); }
    .wl-chg.neg { color: var(--red); }

    #add-ticker-btn {
      margin: 8px;
      padding: 6px;
      background: transparent;
      border: 1px dashed var(--border-mid);
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      width: calc(100% - 16px);
      transition: all 0.15s;
    }

    #add-ticker-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Main chart area ── */
    #main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #ohlc-bar {
      padding: 4px 14px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      align-items: center;
    }

    #ohlc-bar span b { font-weight: 600; }

    #chart-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #chart-canvas, #vol-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border-mid);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p { font-size: 12px; color: var(--text-secondary); }

    #tooltip {
      position: absolute;
      background: var(--bg-panel);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      pointer-events: none;
      display: none;
      z-index: 20;
      line-height: 1.8;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #crosshair-h, #crosshair-v {
      position: absolute;
      pointer-events: none;
      display: none;
      z-index: 3;
    }

    #crosshair-h { height: 1px; left: 0; right: 0; background: var(--border-mid); }
    #crosshair-v { width: 1px; top: 0; bottom: 0; background: var(--border-mid); }

    /* ── AI Panel ── */
    #ai-panel {
      position: absolute;
      bottom: 16px; right: 16px;
      width: 340px;
      background: var(--bg-panel);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 30;
    }

    #ai-panel.open { display: flex; }

    #ai-panel-header {
      padding: 10px 14px;
      background: var(--accent-dim);
      border-bottom: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #ai-panel-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    #ai-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 2px;
    }

    #ai-close:hover { color: var(--text-primary); }

    #ai-messages {
      flex: 1;
      min-height: 140px;
      max-height: 220px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #ai-messages::-webkit-scrollbar { width: 3px; }
    #ai-messages::-webkit-scrollbar-thumb { background: var(--border-mid); }

    .ai-msg {
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.6;
      max-width: 100%;
    }

    .ai-msg.user {
      background: var(--accent-dim);
      color: var(--accent);
      align-self: flex-end;
    }

    .ai-msg.assistant {
      background: var(--bg-hover);
      color: var(--text-primary);
      align-self: flex-start;
    }

    .ai-msg.hint {
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      text-align: center;
      align-self: center;
    }

    #ai-quick-btns {
      padding: 0 10px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .quick-btn {
      padding: 3px 8px;
      background: var(--bg-hover);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      transition: all 0.12s;
    }

    .quick-btn:hover { border-color: var(--accent); color: var(--accent); }

    #ai-input-row {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    #ai-input {
      flex: 1;
      background: var(--bg-base);
      border: 1px solid var(--border-mid);
      border-radius: 5px;
      padding: 6px 8px;
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      outline: none;
    }

    #ai-input:focus { border-color: var(--accent); }
    #ai-input::placeholder { color: var(--text-muted); }

    #ai-send {
      padding: 6px 10px;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.15s;
    }

    #ai-send:hover { opacity: 0.85; }

    /* ── Add ticker modal ── */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--bg-panel);
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      padding: 24px;
      width: 320px;
    }

    #modal h3 { font-size: 14px; margin-bottom: 16px; color: var(--text-primary); }

    #modal input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-base);
      border: 1px solid var(--border-mid);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      outline: none;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #modal input:focus { border-color: var(--accent); }

    #modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

    .modal-btn {
      padding: 7px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-mid);
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-btn:hover { opacity: 0.8; }

    /* ── Status bar ── */
    #statusbar {
      padding: 3px 14px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      gap: 20px;
    }

    #statusbar .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <header id="topbar">
    <div id="logo">
      <div class="dot"></div>
      Leonardo<span>Trader</span>
    </div>
    <div class="sep"></div>
    <div id="ticker-display">
      <span id="ticker-name">AAPL</span>
      <span id="ticker-price" class="pos">—</span>
      <span id="ticker-change" class="pos">—</span>
    </div>
    <div class="sep"></div>
    <div id="tf-group">
      <button class="tf-btn" data-tf="5d">5D</button>
      <button class="tf-btn active" data-tf="1mo">1M</button>
      <button class="tf-btn" data-tf="3mo">3M</button>
      <button class="tf-btn" data-tf="6mo">6M</button>
      <button class="tf-btn" data-tf="1y">1A</button>
      <button class="tf-btn" data-tf="2y">2A</button>
    </div>
    <div class="sep"></div>
    <div id="ind-group">
      <button class="ind-btn on" id="btn-ema20">EMA 20</button>
      <button class="ind-btn on" id="btn-ema50">EMA 50</button>
      <button class="ind-btn on" id="btn-vol">Vol</button>
    </div>
    <div class="sep"></div>
    <button id="ai-topbtn" onclick="toggleAI()">🤖 Analizar con IA</button>
  </header>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="wl-header"><h3>Watchlist</h3></div>
    <input id="search-box" placeholder="Buscar..." oninput="filterWatchlist(this.value)" />
    <div id="watchlist"></div>
    <button id="add-ticker-btn" onclick="openModal()">+ Añadir ticker</button>
  </aside>

  <!-- Main -->
  <main id="main">
    <div id="ohlc-bar">
      <span>O: <b id="ob-o">—</b></span>
      <span>H: <b id="ob-h" style="color:var(--green)">—</b></span>
      <span>L: <b id="ob-l" style="color:var(--red)">—</b></span>
      <span>C: <b id="ob-c">—</b></span>
      <span id="ob-vol" style="margin-left:auto;color:var(--text-muted)">Vol: —</span>
    </div>

    <div id="chart-wrap">
      <canvas id="chart-canvas"></canvas>
      <canvas id="vol-canvas"></canvas>
      <div id="crosshair-h"></div>
      <div id="crosshair-v"></div>
      <div id="tooltip"></div>
      <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Cargando datos...</p>
      </div>
    </div>

    <div id="statusbar">
      <span><span class="live-dot"></span>Yahoo Finance · Data pública</span>
      <span id="sb-range">—</span>
      <span id="sb-candles">—</span>
    </div>

    <!-- AI Panel -->
    <div id="ai-panel">
      <div id="ai-panel-header">
        <span>🤖 Claude AI · Análisis de mercado</span>
        <button id="ai-close" onclick="toggleAI()">✕</button>
      </div>
      <div id="ai-messages">
        <div class="ai-msg hint">Haz preguntas sobre el chart actual.<br>Claude analizará el ticker y contexto de mercado.</div>
      </div>
      <div id="ai-quick-btns">
        <button class="quick-btn" onclick="quickAsk('¿Hay señal de compra?')">¿Señal de compra?</button>
        <button class="quick-btn" onclick="quickAsk('¿Cómo está la tendencia?')">Tendencia</button>
        <button class="quick-btn" onclick="quickAsk('Analiza soporte y resistencia')">Soporte/Resist.</button>
        <button class="quick-btn" onclick="quickAsk('¿Qué dice el EMA?')">EMA signal</button>
      </div>
      <div id="ai-input-row">
        <input id="ai-input" placeholder="Pregunta sobre el chart..." />
        <button id="ai-send" onclick="sendToAI()">↗</button>
      </div>
    </div>
  </main>
</div>

<!-- Add ticker modal -->
<div id="modal-overlay">
  <div id="modal">
    <h3>Añadir ticker a watchlist</h3>
    <input id="modal-input" placeholder="Ej: TSLA, GOOG, MELI..." maxlength="10" />
    <div id="modal-btns">
      <button class="modal-btn" onclick="closeModal()">Cancelar</button>
      <button class="modal-btn primary" onclick="addTicker()">Añadir</button>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────
// State
// ──────────────────────────────────────────
let STOCKS = JSON.parse(localStorage.getItem('lt_stocks') || 'null') || [
  {symbol:'AAPL', name:'Apple'},
  {symbol:'NVDA', name:'Nvidia'},
  {symbol:'AMZN', name:'Amazon'},
  {symbol:'MSFT', name:'Microsoft'},
  {symbol:'UBER', name:'Uber'},
  {symbol:'NFLX', name:'Netflix'},
  {symbol:'META', name:'Meta'},
  {symbol:'HOOD', name:'Robinhood'},
  {symbol:'C',    name:'Citigroup'},
  {symbol:'NKE',  name:'Nike'},
  {symbol:'DIS',  name:'Disney'},
  {symbol:'VZ',   name:'Verizon'},
  {symbol:'NVDL', name:'NVDA 2x L'},
  {symbol:'AMZU', name:'AMZN 1.5x'},
  {symbol:'AMDL', name:'AMD 2x L'},
];

let currentSymbol = 'AAPL';
let currentTf     = '1mo';
let showEma20     = true;
let showEma50     = true;
let showVol       = true;
let candles       = [];
let priceCache    = {};
let hovIdx        = -1;

// ──────────────────────────────────────────
// DOM refs
// ──────────────────────────────────────────
const chartCanvas = document.getElementById('chart-canvas');
const volCanvas   = document.getElementById('vol-canvas');
const ctxM = chartCanvas.getContext('2d');
const ctxV = volCanvas.getContext('2d');
const loadOverlay = document.getElementById('loading-overlay');
const tooltip     = document.getElementById('tooltip');
const crossH      = document.getElementById('crosshair-h');
const crossV      = document.getElementById('crosshair-v');

// ──────────────────────────────────────────
// Watchlist
// ──────────────────────────────────────────
function saveStocks() { localStorage.setItem('lt_stocks', JSON.stringify(STOCKS)); }

function renderWatchlist(filter = '') {
  const wl = document.getElementById('watchlist');
  wl.innerHTML = '';
  STOCKS.filter(s => s.symbol.includes(filter.toUpperCase()) || s.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(s => {
      const div = document.createElement('div');
      div.className = 'wl-item' + (s.symbol === currentSymbol ? ' active' : '');
      div.id = 'wl-' + s.symbol;
      const cache = priceCache[s.symbol];
      const priceHtml = cache
        ? `<span class="wl-price">$${cache.price.toFixed(2)}</span><span class="wl-chg ${cache.chg >= 0 ? 'pos' : 'neg'}">${cache.chg >= 0 ? '+' : ''}${cache.chg.toFixed(2)}%</span>`
        : `<span class="wl-price">—</span>`;
      div.innerHTML = `
        <div class="wl-row">
          <span class="wl-symbol">${s.symbol}</span>
          ${priceHtml}
        </div>
        <span class="wl-name">${s.name}</span>`;
      div.onclick = () => selectStock(s.symbol);
      wl.appendChild(div);
    });
}

function filterWatchlist(v) { renderWatchlist(v); }

// ──────────────────────────────────────────
// Add ticker modal
// ──────────────────────────────────────────
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-input').value = '';
  document.getElementById('modal-input').focus();
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

async function addTicker() {
  const sym = document.getElementById('modal-input').value.trim().toUpperCase();
  if (!sym) return;
  if (STOCKS.find(s => s.symbol === sym)) { closeModal(); selectStock(sym); return; }
  STOCKS.push({ symbol: sym, name: sym });
  saveStocks();
  closeModal();
  renderWatchlist();
  selectStock(sym);
  fetchQuote(sym);
}

document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTicker();
  if (e.key === 'Escape') closeModal();
});

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ──────────────────────────────────────────
// Data fetching
// ──────────────────────────────────────────
const PROXY = 'https://api.allorigins.win/raw?url=';
const YF    = 'https://query1.finance.yahoo.com/v8/finance/chart/';

async function fetchOHLC(symbol, range) {
  const intMap = { '5d': '15m', '1mo': '1d', '3mo': '1d', '6mo': '1d', '1y': '1wk', '2y': '1wk' };
  const interval = intMap[range] || '1d';
  const url = `${YF}${symbol}?interval=${interval}&range=${range}`;
  const res  = await fetch(PROXY + encodeURIComponent(url));
  const json = await res.json();
  const r    = json.chart.result[0];
  const ts   = r.timestamp;
  const q    = r.indicators.quote[0];
  const out  = [];
  for (let i = 0; i < ts.length; i++) {
    if (q.open[i] == null) continue;
    out.push({ t: ts[i] * 1000, o: q.open[i], h: q.high[i], l: q.low[i], c: q.close[i], v: q.volume[i] || 0 });
  }
  return out;
}

async function fetchQuote(symbol) {
  try {
    const url  = `${YF}${symbol}?interval=1d&range=5d`;
    const res  = await fetch(PROXY + encodeURIComponent(url));
    const json = await res.json();
    const q    = json.chart.result[0].indicators.quote[0];
    const cls  = q.close.filter(x => x != null);
    const last = cls[cls.length - 1];
    const prev = cls[cls.length - 2] || last;
    const chg  = (last - prev) / prev * 100;
    priceCache[symbol] = { price: last, chg };
    renderWatchlist(document.getElementById('search-box').value);
    if (symbol === currentSymbol) updateTickerHeader(last, chg);
  } catch (e) { /* silent */ }
}

// ──────────────────────────────────────────
// Select stock
// ──────────────────────────────────────────
async function selectStock(symbol) {
  currentSymbol = symbol;
  renderWatchlist(document.getElementById('search-box').value);
  document.getElementById('ticker-name').textContent = symbol;
  loadOverlay.style.display = 'flex';
  candles = [];
  try {
    candles = await fetchOHLC(symbol, currentTf);
    loadOverlay.style.display = 'none';
    drawChart();
    updateStatusBar();
    fetchQuote(symbol);
  } catch (e) {
    loadOverlay.querySelector('p').textContent = '⚠ Error cargando datos';
  }
}

function updateTickerHeader(price, chg) {
  const priceEl = document.getElementById('ticker-price');
  const chgEl   = document.getElementById('ticker-change');
  priceEl.textContent = '$' + price.toFixed(2);
  priceEl.style.color = chg >= 0 ? 'var(--green)' : 'var(--red)';
  chgEl.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
  chgEl.className = 'pos' ? (chg >= 0 ? 'pos' : 'neg') : (chg >= 0 ? 'pos' : 'neg');
}

function updateStatusBar() {
  if (!candles.length) return;
  const first = candles[0], last = candles[candles.length - 1];
  const d1 = new Date(first.t).toLocaleDateString('es-CL');
  const d2 = new Date(last.t).toLocaleDateString('es-CL');
  document.getElementById('sb-range').textContent = `${d1} → ${d2}`;
  document.getElementById('sb-candles').textContent = `${candles.length} velas`;
}

// ──────────────────────────────────────────
// EMA
// ──────────────────────────────────────────
function calcEMA(vals, period) {
  const k = 2 / (period + 1);
  const out = new Array(vals.length).fill(null);
  let sum = 0, cnt = 0;
  for (let i = 0; i < vals.length; i++) {
    if (vals[i] == null) continue;
    if (cnt < period) { sum += vals[i]; cnt++; if (cnt === period) out[i] = sum / period; }
    else out[i] = vals[i] * k + out[i - 1] * (1 - k);
  }
  return out;
}

// ──────────────────────────────────────────
// Draw
// ──────────────────────────────────────────
function resizeCanvases() {
  const wrap = document.getElementById('chart-wrap');
  chartCanvas.width = wrap.clientWidth;
  chartCanvas.height = wrap.clientHeight;
  volCanvas.width = wrap.clientWidth;
  volCanvas.height = wrap.clientHeight;
}

function drawChart() {
  if (!candles.length) return;
  resizeCanvases();
  const W = chartCanvas.width, H = chartCanvas.height;
  const volH  = showVol ? H * 0.17 : 0;
  const padL  = 4, padR = 68, padT = 12, padB = volH + 24;
  const cH    = H - padT - padB;
  const n     = candles.length;
  const step  = (W - padL - padR) / n;
  const cW    = Math.max(1, Math.floor(step * 0.7));

  const closes = candles.map(c => c.c);
  const ema20  = showEma20 ? calcEMA(closes, 20) : null;
  const ema50  = showEma50 ? calcEMA(closes, 50) : null;

  let minP = Math.min(...candles.map(c => c.l));
  let maxP = Math.max(...candles.map(c => c.h));
  if (ema20) ema20.forEach(v => { if (v) { minP = Math.min(minP, v); maxP = Math.max(maxP, v); } });
  if (ema50) ema50.forEach(v => { if (v) { minP = Math.min(minP, v); maxP = Math.max(maxP, v); } });
  const rng = (maxP - minP) || 1;
  const pad = rng * 0.04;
  minP -= pad; maxP += pad;
  const rngP = maxP - minP;

  const py = p => padT + (1 - (p - minP) / rngP) * cH;
  const px = i => padL + step * i + step / 2;

  // Background
  ctxM.fillStyle = '#0b0e13';
  ctxM.fillRect(0, 0, W, H);

  // Grid
  ctxM.strokeStyle = '#1a1f2a';
  ctxM.lineWidth = 0.5;
  for (let i = 0; i <= 5; i++) {
    const y = padT + (cH / 5) * i;
    ctxM.beginPath(); ctxM.moveTo(padL, y); ctxM.lineTo(W - padR, y); ctxM.stroke();
    const price = maxP - (rngP / 5) * i;
    ctxM.fillStyle = '#4a5568';
    ctxM.font = '10px IBM Plex Mono';
    ctxM.textAlign = 'left';
    ctxM.fillText('$' + price.toFixed(2), W - padR + 6, y + 3);
  }

  // X-axis date labels
  const labelEvery = Math.max(1, Math.floor(n / 6));
  ctxM.fillStyle = '#4a5568';
  ctxM.font = '9px IBM Plex Mono';
  ctxM.textAlign = 'center';
  candles.forEach((c, i) => {
    if (i % labelEvery !== 0) return;
    const d = new Date(c.t);
    const label = currentTf === '5d'
      ? d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('es-CL', { month: 'short', day: 'numeric' });
    ctxM.fillText(label, px(i), H - volH - 8);
  });

  // Candles
  candles.forEach((c, i) => {
    const x    = px(i);
    const isUp = c.c >= c.o;
    const col  = isUp ? '#22c55e' : '#ef4444';
    const fill = i === hovIdx ? col : (isUp ? '#0d2b1a' : '#2b0d0d');

    ctxM.strokeStyle = col; ctxM.lineWidth = 1;
    ctxM.beginPath(); ctxM.moveTo(x, py(c.h)); ctxM.lineTo(x, py(c.l)); ctxM.stroke();

    const top = py(Math.max(c.o, c.c));
    const bot = py(Math.min(c.o, c.c));
    const bh  = Math.max(1, bot - top);
    ctxM.fillStyle = fill;
    ctxM.fillRect(x - cW / 2, top, cW, bh);
    ctxM.strokeRect(x - cW / 2, top, cW, bh);
  });

  // EMA lines
  function drawEMA(vals, color) {
    ctxM.strokeStyle = color; ctxM.lineWidth = 1.3;
    ctxM.beginPath(); let started = false;
    vals.forEach((v, i) => {
      if (!v) return;
      if (!started) { ctxM.moveTo(px(i), py(v)); started = true; }
      else ctxM.lineTo(px(i), py(v));
    });
    ctxM.stroke();
  }

  if (ema20) drawEMA(ema20, '#f97316');
  if (ema50) drawEMA(ema50, '#3b82f6');

  // EMA legend
  ctxM.font = '10px IBM Plex Mono';
  ctxM.textAlign = 'left';
  if (ema20) { ctxM.fillStyle = '#f97316'; ctxM.fillText('EMA 20', padL + 4, padT + 14); }
  if (ema50) { ctxM.fillStyle = '#3b82f6'; ctxM.fillText('EMA 50', padL + 64, padT + 14); }

  // Current price line
  const lastPrice = candles[candles.length - 1].c;
  const isLastUp  = candles[candles.length - 1].c >= candles[candles.length - 1].o;
  ctxM.strokeStyle = isLastUp ? '#22c55e44' : '#ef444444';
  ctxM.lineWidth = 0.8;
  ctxM.setLineDash([4, 4]);
  ctxM.beginPath(); ctxM.moveTo(padL, py(lastPrice)); ctxM.lineTo(W - padR, py(lastPrice)); ctxM.stroke();
  ctxM.setLineDash([]);
  ctxM.fillStyle = isLastUp ? '#22c55e' : '#ef4444';
  ctxM.font = '10px IBM Plex Mono';
  ctxM.textAlign = 'left';
  ctxM.fillText('$' + lastPrice.toFixed(2), W - padR + 6, py(lastPrice) + 3);

  // Volume
  ctxV.clearRect(0, 0, W, H);
  if (showVol) {
    const vTop = H - volH - 20;
    const maxVol = Math.max(...candles.map(c => c.v));
    candles.forEach((c, i) => {
      const x = px(i);
      const isUp = c.c >= c.o;
      const bh = (c.v / maxVol) * (volH - 4);
      ctxV.fillStyle = isUp ? '#16401e' : '#401616';
      ctxV.fillRect(x - cW / 2, vTop + (volH - 4) - bh, cW, bh);
    });
    ctxV.fillStyle = '#1e2535';
    ctxV.fillRect(padL, vTop - 1, W - padL - padR, 1);
    ctxV.fillStyle = '#4a5568'; ctxV.font = '9px IBM Plex Mono'; ctxV.textAlign = 'left';
    ctxV.fillText('VOL', padL + 4, vTop + 10);
  }

  // Hovered candle OHLC bar
  if (hovIdx >= 0 && hovIdx < candles.length) {
    const c = candles[hovIdx];
    const isUp = c.c >= c.o;
    document.getElementById('ob-o').textContent = c.o.toFixed(2);
    document.getElementById('ob-h').textContent = c.h.toFixed(2);
    document.getElementById('ob-l').textContent = c.l.toFixed(2);
    document.getElementById('ob-c').textContent = c.c.toFixed(2);
    document.getElementById('ob-c').style.color = isUp ? 'var(--green)' : 'var(--red)';
    document.getElementById('ob-vol').textContent = 'Vol: ' + (c.v / 1e6).toFixed(2) + 'M';
  }
}

// ──────────────────────────────────────────
// Mouse interaction
// ──────────────────────────────────────────
function getIdxFromX(x) {
  const W    = chartCanvas.width;
  const n    = candles.length;
  const step = (W - 4 - 68) / n;
  return Math.max(0, Math.min(n - 1, Math.round((x - 4) / step)));
}

chartCanvas.addEventListener('mousemove', e => {
  const rect = chartCanvas.getBoundingClientRect();
  const mx   = e.clientX - rect.left;
  const my   = e.clientY - rect.top;

  crossH.style.display = 'block'; crossH.style.top  = my + 'px';
  crossV.style.display = 'block'; crossV.style.left = mx + 'px';

  if (!candles.length) return;
  hovIdx = getIdxFromX(mx);
  drawChart();

  const c = candles[hovIdx];
  if (!c) return;
  const isUp  = c.c >= c.o;
  const date  = new Date(c.t).toLocaleDateString('es-CL', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  const chgPct = ((c.c - c.o) / c.o * 100);
  tooltip.innerHTML = `
    <b style="color:var(--text-primary)">${date}</b><br>
    O: <b>${c.o.toFixed(2)}</b>  H: <b style="color:var(--green)">${c.h.toFixed(2)}</b>  L: <b style="color:var(--red)">${c.l.toFixed(2)}</b>  C: <b style="color:${isUp ? 'var(--green)' : 'var(--red)'}">${c.c.toFixed(2)}</b><br>
    Vol: <b>${(c.v / 1e6).toFixed(2)}M</b>  <span style="color:${isUp ? 'var(--green)' : 'var(--red)'}">${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}%</span>`;
  tooltip.style.display = 'block';
  const tx = Math.min(mx + 14, chartCanvas.width - 240);
  const ty = Math.max(8, my - 70);
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});

chartCanvas.addEventListener('mouseleave', () => {
  crossH.style.display = 'none';
  crossV.style.display = 'none';
  tooltip.style.display = 'none';
  hovIdx = -1;
  drawChart();
});

// ──────────────────────────────────────────
// Timeframe buttons
// ──────────────────────────────────────────
document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTf = btn.dataset.tf;
    selectStock(currentSymbol);
  };
});

// ──────────────────────────────────────────
// Indicator toggles
// ──────────────────────────────────────────
document.getElementById('btn-ema20').onclick = function () { showEma20 = !showEma20; this.classList.toggle('on'); drawChart(); };
document.getElementById('btn-ema50').onclick = function () { showEma50 = !showEma50; this.classList.toggle('on'); drawChart(); };
document.getElementById('btn-vol').onclick   = function () { showVol   = !showVol;   this.classList.toggle('on'); drawChart(); };

// ──────────────────────────────────────────
// AI Panel
// ──────────────────────────────────────────
function toggleAI() {
  document.getElementById('ai-panel').classList.toggle('open');
  if (document.getElementById('ai-panel').classList.contains('open')) {
    document.getElementById('ai-input').focus();
  }
}

function buildContext() {
  if (!candles.length) return '';
  const last5 = candles.slice(-5).map(c =>
    `${new Date(c.t).toLocaleDateString('es-CL')} O:${c.o.toFixed(2)} H:${c.h.toFixed(2)} L:${c.l.toFixed(2)} C:${c.c.toFixed(2)} Vol:${(c.v/1e6).toFixed(1)}M`
  ).join('\n');
  const first = candles[0], last = candles[candles.length - 1];
  const totalChg = ((last.c - first.c) / first.c * 100).toFixed(2);
  const highs = candles.map(c => c.h), lows = candles.map(c => c.l);
  const maxH = Math.max(...highs).toFixed(2), minL = Math.min(...lows).toFixed(2);
  return `Ticker: ${currentSymbol} | Timeframe: ${currentTf} | Total candles: ${candles.length}
Cambio período: ${totalChg}% | Rango: $${minL} – $${maxH}
Últimas 5 velas:\n${last5}
EMA 20 activa: ${showEma20} | EMA 50 activa: ${showEma50}`;
}

function addMessage(role, text) {
  const msgs = document.getElementById('ai-messages');
  const div  = document.createElement('div');
  div.className = `ai-msg ${role}`;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function sendToAI() {
  const input = document.getElementById('ai-input');
  const q     = input.value.trim();
  if (!q) return;
  const ctx = buildContext();
  const fullMsg = `Soy un trader analizando ${currentSymbol}. Aquí está el contexto del chart:\n\n${ctx}\n\nMi pregunta: ${q}`;
  addMessage('user', q);
  input.value = '';
  window.open(`https://claude.ai/new?q=${encodeURIComponent(fullMsg)}`, '_blank');
}

function quickAsk(question) {
  document.getElementById('ai-input').value = question;
  sendToAI();
}

document.getElementById('ai-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendToAI();
});

// ──────────────────────────────────────────
// Init
// ──────────────────────────────────────────
window.addEventListener('resize', () => { if (candles.length) drawChart(); });

renderWatchlist();
selectStock('AAPL');

// Background quote refresh
STOCKS.slice(0, 8).forEach((s, i) => {
  setTimeout(() => fetchQuote(s.symbol), i * 600);
});
